<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#1b1b1f}</style>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script></head><body>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
import {applyPlayerInfo} from './web/jerseyPlayerInfo.js';
const ff=new FontFace('Alfa Slab One','url(./fonts/AlfaSlabOne-Regular.ttf)'); document.fonts.add(await ff.load());
const W=600,H=640;
const r=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});
r.setSize(W,H); r.outputColorSpace=THREE.SRGBColorSpace; r.toneMapping=THREE.ACESFilmicToneMapping; r.toneMappingExposure=1.0;
document.body.appendChild(r.domElement);
const scene=new THREE.Scene(); scene.background=new THREE.Color(0x1b1b1f);
const pm=new THREE.PMREMGenerator(r); scene.environment=pm.fromScene(new RoomEnvironment(),0.04).texture;
scene.add(new THREE.HemisphereLight(0xffffff,0x333333,0.6));
const dl=new THREE.DirectionalLight(0xffffff,1.0); dl.position.set(1,2,3); scene.add(dl);
const cam=new THREE.PerspectiveCamera(30,W/H,0.01,20);
const g=await new GLTFLoader().loadAsync(new URLSearchParams(location.search).get('f')||'./hfpl_jersey.glb');
const root=g.scene; scene.add(root);
const info={meshes:[],textures:[]};
root.traverse(o=>{ if(o.isMesh){info.meshes.push({name:o.name,verts:o.geometry.attributes.position.count,
  hasUV:!!o.geometry.attributes.uv,hasNormal:!!o.geometry.attributes.normal,mat:o.material.name,
  map:o.material.map?[o.material.map.image.width,o.material.map.image.height]:null});}});
window.INFO=info;
window.shot=(deg,elev=0.05,dist=2.15)=>{const a=deg*Math.PI/180;
  cam.position.set(Math.sin(a)*dist,elev*dist,Math.cos(a)*dist); cam.lookAt(0,0,0); r.render(scene,cam);
  return r.domElement.toDataURL('image/png');};
window.setPlayer=async(n,num)=>{await applyPlayerInfo(root,{name:n,number:num});return true;};
window.READY=true;
</script></body></html>
