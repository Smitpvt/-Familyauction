<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>HFPL jersey QA renderer</title>
  <link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&display=swap" rel="stylesheet">
  <style>html,body{margin:0;background:#07080a;overflow:hidden}canvas{display:block}</style>
</head>
<body>
<!-- Dev-only QA harness used by render_previews.mjs. Mirrors the /jersey showcase scene
     (tone mapping, local studio environment, lights, camera, captain-name lettering).
     /tools/jersey/preview.html?team=sherle&save=http://localhost:5199&views=front:0,back:180 -->
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/examples/jsm/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/examples/jsm/environments/RoomEnvironment.js';
import { applyPlayerInfo, cloneJersey } from '/src/utils/jerseyPlayerInfo.js';

const CAPTAIN = { sherle: 'SHRI', ratnagiri: 'SAGAR', malgund: 'RAJESH', kotwade: 'VIJAY' };
const q = new URLSearchParams(location.search);
const team = q.get('team') || 'sherle';
const W = +(q.get('w') || 900), H = +(q.get('h') || 900);

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H);
renderer.setPixelRatio(1);
renderer.toneMapping = THREE.NeutralToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color('#07080a');
const pm = new THREE.PMREMGenerator(renderer);
scene.environment = pm.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.6;
scene.add(new THREE.AmbientLight('#ffffff', 0.25));
const key = new THREE.DirectionalLight('#ffffff', 1.5);
key.position.set(2.0, 2.5, 2.8);
key.castShadow = true;
key.shadow.mapSize.set(1024, 1024);
key.shadow.normalBias = 0.01;
key.shadow.bias = -0.0002;
scene.add(key);
for (const [p, i, c] of [[[-2.2, 1.8, -1.8], 0.9, '#ffffff'], [[0, 2.8, -2.5], 0.5, '#ffffff'], [[-1.5, -0.2, 2.0], 0.25, '#eef4ff']]) {
  const l = new THREE.DirectionalLight(c, i); l.position.set(...p); scene.add(l);
}

// same camera as the showcase: fov 28, distance 1.78, looking at the jersey centre
const cam = new THREE.PerspectiveCamera(28, W / H, 0.1, 20);
const dist = +(q.get('dist') || 1.78), pitch = +(q.get('pitch') || 0.03);
// optional close-up framing: lx/ly = look-at point, camera placed straight in front of it
const lx = +(q.get('lx') || 0), ly = +(q.get('ly') || -0.005);
cam.position.set(lx, q.get('ly') ? ly + pitch * 0.2 : pitch * dist / 1.78, dist);
cam.lookAt(lx, ly, 0);

new GLTFLoader().load(`/models/hfpl_jersey_${team}.glb`, async (gltf) => {
  const jersey = cloneJersey(gltf.scene);
  jersey.traverse((o) => {
    if (o.name === 'PlayerNumber' || (q.get('noname') && o.name === 'PlayerName')) o.visible = false;
    if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; }
  });
  await applyPlayerInfo(jersey, { name: CAPTAIN[team], number: '' });
  const group = new THREE.Group();
  group.position.y = -0.02;
  group.add(jersey);
  scene.add(group);
  const box = new THREE.Box3().setFromObject(jersey);
  const info = { team, center: box.getCenter(new THREE.Vector3()).toArray().map((v) => +v.toFixed(3)),
                 size: box.getSize(new THREE.Vector3()).toArray().map((v) => +v.toFixed(3)) };
  // ?uvpass=1 : unlit texture-coordinate render (R = u, G = v) for mapping screen pixels to atlas texels
  if (q.get('uvpass')) {
    renderer.toneMapping = THREE.NoToneMapping;
    renderer.outputColorSpace = THREE.LinearSRGBColorSpace;
    const uvMat = new THREE.ShaderMaterial({
      vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
      fragmentShader: 'varying vec2 vUv; void main(){ gl_FragColor = vec4(vUv, 1.0, 1.0); }',
    });
    jersey.traverse((o) => { if (o.isMesh) o.material = o.material.name === 'JerseyPrint' ? uvMat : new THREE.MeshBasicMaterial({ color: 0x000000 }); });
    scene.background = new THREE.Color(0x000000);
    scene.environment = null;
  }
  const save = q.get('save');
  if (save) {
    for (const [label, deg] of (q.get('views') || 'front:0').split(',').map((s) => s.split(':'))) {
      group.rotation.y = THREE.MathUtils.degToRad(+deg);     // the showcase rotates the jersey, not the camera
      renderer.render(scene, cam);
      await fetch(`${save}/save?file=${team}_${label}.png`, { method: 'POST', body: renderer.domElement.toDataURL('image/png') });
    }
    await fetch(`${save}/done?info=${encodeURIComponent(JSON.stringify(info))}`, { method: 'POST' });
  } else {
    renderer.render(scene, cam);
  }
  document.title = 'READY ' + JSON.stringify(info);
}, undefined, (e) => {
  document.title = 'ERROR ' + e.message;
  if (q.get('save')) fetch(`${q.get('save')}/done?error=${encodeURIComponent(e.message)}`, { method: 'POST' });
});
</script>
</body>
</html>
